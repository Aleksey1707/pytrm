repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
        fail_fast: true
      - id: check-added-large-files
        fail_fast: true

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        require_serial: true
        pass_filenames: false
        fail_fast: true

      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        fail_fast: true

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --check
        language: system
        types: [python]
        fail_fast: true

      - id: pytest_tox
        name: pytest_tox
        entry: uv run tox -p auto
        language: system
        require_serial: true
        pass_filenames: false
