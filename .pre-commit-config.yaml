repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
        fail_fast: true
      - id: check-added-large-files
        fail_fast: true

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --all-extras mypy
        language: system
        require_serial: true
        pass_filenames: false
        fail_fast: true

      - id: ruff-check
        name: ruff-check
        entry: uv run --all-extras ruff check --fix
        language: system
        types: [python]
        fail_fast: true

      - id: ruff-format
        name: ruff-format
        entry: uv run --all-extras ruff format --check
        language: system
        types: [python]
        fail_fast: true

      - id: rules-check
        name: rules-check
        entry: uv run --all-extras python scripts/rules_lint.py
        language: system
        require_serial: true
        pass_filenames: false
        fail_fast: true

      - id: pytest-fast
        name: pytest-fast
        entry: uv run --all-extras pytest -m "not integration"
        language: system
        require_serial: true
        pass_filenames: false

      - id: pytest_tox
        name: pytest_tox
        entry: make test
        language: system
        require_serial: true
        pass_filenames: false
        stages: [pre-push]
