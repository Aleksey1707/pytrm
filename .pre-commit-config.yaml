repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: /bin/bash -c "venv/bin/mypy"
        language: script
      - id: black
        name: black
        entry: /bin/bash -c "venv/bin/black --check ."
        language: script
      - id: isort
        name: isort
        entry: /bin/bash -c "venv/bin/isort --check ."
        language: script
      - id: flake8
        name: flake8
        entry: /bin/bash -c "venv/bin/flake8"
        language: script
      - id: pytest
        name: pytest
        entry: /bin/bash -c "venv/bin/pytest"
        language: script
