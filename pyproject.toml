[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytrm"
version = "0.3.0"
description = "PyTRM is a transaction manager as abstraction of database access."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9,<4.0"
authors = [
    { name = "Aleksey Odinokov", email = "AlekseyOdi@yandex.ru" },
]
dependencies = [
    "typing_extensions>=4.12",
]

[project.optional-dependencies]
mongo-motor = ["motor>=3"]
mongo-pymongo = ["pymongo>=4.9"]
sqlalchemy = ["SQLAlchemy>=2"]
redis = ["redis>=5"]

[dependency-groups]
dev = [
    "asyncpg>=0.30",
    "mypy==1.13",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "ruff>=0.9",
    "testcontainers==4.1.0",
    "tox==4.24.1",
    "tox-uv>=1",
    "redis>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["pytrm"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
packages = ["pytrm", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_any_unimported = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/mongo/conftest.py" = ["E501"]
"tests/*.py" = ["F841"]

[tool.ruff.format]
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: тест требует внешней инфраструктуры (Docker-контейнер БД через testcontainers)",
]