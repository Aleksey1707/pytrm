[tox]
requires =
    tox>=4.23
    tox-uv>=1
env_list =
    py{39, 310, 311, 312, 313, 314}
minversion = 4.23.0
skipsdist = True

[testenv]
description = run the tests with pytest
runner = uv-venv-runner
deps =
    pytest>=8
    pytest-asyncio>=0.24
    testcontainers==4.13.0
    sqlalchemy>=2
    asyncpg>=0.30
    motor>=3
    pymongo>=4.9
    redis>=5
    typing_extensions>=4.12
passenv =
    DOCKER_HOST
    XDG_RUNTIME_DIR
    TESTCONTAINERS_*
setenv =
    DOCKER_HOST = {env:DOCKER_HOST:unix://{env:XDG_RUNTIME_DIR:/run/user/1000}/podman/podman.sock}
    TESTCONTAINERS_RYUK_DISABLED = {env:TESTCONTAINERS_RYUK_DISABLED:true}
commands =
    python -m pytest {posargs}
