[tox]
env_list =
    py{39, 310, 311, 312}
minversion = 4.23.0
skipsdist = True

[testenv]
description = run the tests with pytest
deps =
    pytest>=8
    pytest-asyncio>=0.24
    testcontainers>=3.7
    sqlalchemy>=2
    asyncpg>=0.30
    motor>=3
    -rrequirements.txt
setenv=
    DOCKER_HOST=unix:///run/user/1000/podman/podman.sock
    TESTCONTAINERS_RYUK_DISABLED=true
commands =
    python -m pytest {posargs}
